name: BazarSync-AI CI Pipeline

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend Lint & Import Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install flake8

      - name: Run Flake8 Lint
        run: |
          flake8 app --max-line-length=100

      - name: Backend Import Test
        run: |
          python -c "from app.main import app"

  scraper:
    name: Scraper Installation Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install playwright pandas beautifulsoup4 sqlalchemy psycopg2-binary sentence-transformers

      - name: Install Playwright Browsers
        run: playwright install --with-deps